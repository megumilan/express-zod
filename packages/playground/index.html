<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <link href="/favicon.svg" rel="icon">
        <title>express-zod Playground</title>
    </head>
    <body
        class="flex h-dvh flex-col overflow-hidden text-base-content antialiased"
    >
        <header
            class="flex h-11 shrink-0 items-center gap-2.5 border-b border-base-300 bg-base-100 px-4"
        >
            <svg
                aria-hidden="true"
                class="text-primary"
                fill="none"
                height="20"
                viewBox="0 0 20 20"
                width="20"
            >
                <path
                    d="M10 1.5 2.5 5.5v9L10 18.5l7.5-4v-9L10 1.5Z"
                    stroke="currentColor"
                    stroke-width="1.4"
                />
                <path
                    d="M7.2 7.5 5 10l2.2 2.5M10 12.5h5"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.4"
                />
            </svg>
            <div class="flex items-baseline gap-1.5 leading-none">
                <span class="text-xl font-bold"> express-zod </span>
                <span class="font-medium tracking-wider text-base-content/40">
                    playground
                </span>
            </div>
        </header>

        <div
            aria-label="Source files"
            class="tabs shrink-0 overflow-x-auto border-b border-base-300 bg-base-200"
            id="file-tabs"
            role="tablist"
        >
            <button
                class="tab gap-1.5"
                data-file="server.ts"
                role="tab"
                type="button"
            >
                <svg
                    aria-hidden="true"
                    class="shrink-0"
                    height="14"
                    viewBox="0 0 32 32"
                    width="14"
                >
                    <rect fill="#3178C6" height="32" rx="5" width="32"></rect>
                    <text
                        fill="#ffffff"
                        font-family="ui-sans-serif, system-ui, sans-serif"
                        font-size="15"
                        font-weight="700"
                        text-anchor="middle"
                        x="16"
                        y="22"
                    >
                        TS
                    </text>
                </svg>
                server.ts
                <span
                    aria-hidden="true"
                    class="h-1.5 w-1.5 rounded-full bg-warning opacity-0 transition-opacity duration-200"
                    data-modified-dot
                ></span>
            </button>
            <button
                class="tab gap-1.5"
                data-file="client.ts"
                role="tab"
                type="button"
            >
                <svg
                    aria-hidden="true"
                    class="shrink-0"
                    height="14"
                    viewBox="0 0 32 32"
                    width="14"
                >
                    <rect fill="#3178C6" height="32" rx="5" width="32"></rect>
                    <text
                        fill="#ffffff"
                        font-family="ui-sans-serif, system-ui, sans-serif"
                        font-size="15"
                        font-weight="700"
                        text-anchor="middle"
                        x="16"
                        y="22"
                    >
                        TS
                    </text>
                </svg>
                client.ts
                <span
                    aria-hidden="true"
                    class="h-1.5 w-1.5 rounded-full bg-warning opacity-0 transition-opacity duration-200"
                    data-modified-dot
                ></span>
            </button>
        </div>

        <div class="min-h-0 flex-1" id="editor"></div>

        <script src="/src/main.ts" type="module"></script>
    </body>
</html>
