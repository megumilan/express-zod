name: Deploy Playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/playground/**"
      - "packages/core/**"
      - "packages/client/**"
      - "packages/openapi/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build library packages
        run: pnpm -r --filter "./packages/*" --filter "!playground" build

      - name: Build playground
        run: pnpm --filter playground build
        env:
          BASE_PATH: /express-zod/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
